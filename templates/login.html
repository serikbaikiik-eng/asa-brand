{% extends "base.html" %}{% block body %}
<div class="box" style="max-width:360px;margin:60px auto"><h1>Вход в админку</h1>
{% if err %}<p style="color:#e58f7a">{{ err }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input name="login" placeholder="Логин" autocomplete="username" style="width:100%;margin-bottom:10px" autofocus>
<input type="password" name="password" placeholder="Пароль" autocomplete="current-password" style="width:100%;margin-bottom:10px">
<button style="width:100%">Войти</button></form>
<p style="margin:14px 0 0"><a href="/">← В магазин</a></p></div>{% endblock %}
