{% extends "base.html" %}{% block body %}
<h1>Аккаунт администратора</h1>
<div class="box" style="max-width:440px">
{% if msg %}<div class="flash">{{ msg }}</div>{% endif %}{% if err %}<p style="color:#e58f7a">{{ err }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<p>Логин<br><input name="login" value="{{ login }}" style="width:100%" autocomplete="username"></p>
<p>Новый пароль (оставьте пустым, чтобы не менять)<br><input type="password" name="password" style="width:100%" autocomplete="new-password"></p>
<p>Повторите новый пароль<br><input type="password" name="password2" style="width:100%" autocomplete="new-password"></p>
<p>Текущий пароль (для подтверждения)<br><input type="password" name="current" required style="width:100%" autocomplete="current-password"></p>
<button>Сохранить</button></form></div>{% endblock %}
